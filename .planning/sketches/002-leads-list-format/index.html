<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch 002 — Leads List Format</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--color-bg);
    color: var(--color-text);
    font-size: var(--text-base);
    padding-top: 48px;
    -webkit-font-smoothing: antialiased;
  }
  svg { display: block; width: 16px; height: 16px; flex-shrink: 0; }

  #variant-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9998;
    background: var(--color-surface); border-bottom: 1px solid var(--color-border);
    padding: 8px 16px; display: flex; gap: 8px; align-items: center;
  }
  #variant-nav .label { font-size: var(--text-xs); color: var(--color-text-muted); margin-right: 8px; }
  .variant-tab {
    border: 1px solid var(--color-border); background: var(--color-surface);
    color: var(--color-text-muted); padding: 6px 12px; border-radius: var(--radius-md);
    font-size: var(--text-sm); cursor: pointer; transition: all 0.15s ease;
  }
  .variant-tab:hover { background: var(--color-surface-sunken); color: var(--color-text); }
  .variant-tab.active { background: var(--color-primary-soft); color: var(--color-primary); border-color: var(--color-primary); font-weight: 600; }

  .variant { display: none; }
  .variant.active { display: block; }

  /* ---- Shared shell (sidebar = winner do sketch 001: variante C) ---- */
  .app-shell { display: flex; min-height: calc(100vh - 48px); }
  .sidebar { width: var(--sidebar-width-expanded); flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--sidebar-border); display: flex; flex-direction: column; }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 20px 18px 22px; }
  .brand-mark { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .brand-text { font-size: var(--text-sm); font-weight: 700; }
  .brand-sub { font-size: 11px; color: var(--color-text-faint); }
  .nav-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-faint); padding: 12px 14px 6px; }
  .nav-section { padding: 4px 14px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-md); color: var(--sidebar-text); cursor: pointer; font-size: var(--text-sm); font-weight: 500; transition: all 0.15s ease; margin-bottom: 3px; }
  .nav-item svg { flex-shrink: 0; width: 18px; height: 18px; color: var(--sidebar-text-muted); }
  .nav-item:hover { background: var(--sidebar-hover-bg); }
  .nav-item.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-text); font-weight: 600; }
  .nav-item.active svg { color: var(--sidebar-active-text); }
  .sidebar-footer { margin-top: auto; padding: 16px 18px; border-top: 1px solid var(--sidebar-border); display: flex; align-items: center; gap: 10px; }
  .avatar { width: 30px; height: 30px; border-radius: var(--radius-full); background: var(--color-primary-soft); color: var(--color-primary); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .avatar-name { font-size: var(--text-sm); font-weight: 600; }

  .app-main { flex: 1; min-width: 0; }
  .topbar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--color-border); background: var(--color-surface); }
  .topbar h1 { font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.01em; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; cursor: pointer; font-family: var(--font-sans); font-size: var(--text-sm); font-weight: 600; border-radius: var(--radius-md); padding: 8px 14px; transition: all 0.15s ease; }
  .btn-primary { background: var(--color-primary); color: #fff; box-shadow: var(--shadow-sm); }
  .btn-primary:hover { background: var(--color-primary-hover); }
  .content { padding: 24px 28px; }

  .filters-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 7px 12px; font-size: var(--text-sm); color: var(--color-text-muted); cursor: pointer; transition: all 0.15s ease; }
  .filter-pill:hover { border-color: var(--color-border-strong); color: var(--color-text); }

  /* stage badge colors */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 600; }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.novo { background: #eef0fe; color: #4f46e5; }
  .badge.contatado { background: #fef6e7; color: #b45309; }
  .badge.negociacao { background: #eafbf1; color: #16a34a; }
  .badge.fechado { background: #f2f3f5; color: #4b5563; }

  .wa-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--radius-md); background: var(--color-whatsapp-soft); color: var(--color-whatsapp-hover); border: none; cursor: pointer; transition: all 0.15s ease; flex-shrink: 0; }
  .wa-btn:hover { background: var(--color-whatsapp); color: #fff; transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .wa-btn.big { width: auto; padding: 7px 12px; gap: 6px; font-size: var(--text-sm); font-weight: 600; }

  /* ============ VARIANT A: tabela restilizada ============ */
  .table-wrap { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-faint); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--color-border); background: var(--color-surface-sunken); }
  tbody td { padding: 13px 16px; font-size: var(--text-base); border-bottom: 1px solid var(--color-border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.15s ease; }
  tbody tr:hover { background: var(--color-surface-sunken); }
  .name-cell { display: flex; align-items: center; gap: 10px; }
  .avatar-sm { width: 30px; height: 30px; border-radius: var(--radius-full); background: var(--color-primary-soft); color: var(--color-primary); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }

  /* ============ VARIANT B: cards estilo Filllo ============ */
  .cards-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .lead-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); transition: all 0.15s ease; cursor: pointer; }
  .lead-card:hover { box-shadow: var(--shadow-md); border-color: var(--color-border-strong); transform: translateY(-1px); }
  .lead-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .lead-card-id { display: flex; align-items: center; gap: 10px; }
  .lead-card-name { font-weight: 600; font-size: var(--text-md); }
  .lead-card-niche { font-size: var(--text-xs); color: var(--color-text-faint); }
  .lead-card-meta { display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--color-text-muted); margin-bottom: 8px; }
  .lead-card-meta svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--color-text-faint); }
  .lead-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--color-border); }

  /* ============ VARIANT C: híbrido (tabela + affordance de card) ============ */
  .hybrid-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--color-border); transition: background 0.15s ease; }
  .hybrid-row:last-child { border-bottom: none; }
  .hybrid-row:hover { background: var(--color-surface-sunken); }
  .hybrid-row .name-cell { flex: 2; min-width: 0; }
  .hybrid-row .col { flex: 1; font-size: var(--text-sm); color: var(--color-text-muted); }

  #sketch-tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font-family: system-ui; font-size: 12px; background: rgba(0,0,0,0.75); color: #fff; padding: 8px 12px; border-radius: 8px; opacity: 0.4; transition: opacity 0.2s; display: flex; gap: 10px; align-items: center; }
  #sketch-tools:hover { opacity: 1; }
  #sketch-tools select, #sketch-tools button { font-size: 11px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 3px 6px; cursor: pointer; }
</style>
</head>
<body>

<div id="variant-nav">
  <span class="label">Sketch 002 — Leads List Format</span>
  <button class="variant-tab active" onclick="showVariant('a')">A: Tabela restilizada</button>
  <button class="variant-tab" onclick="showVariant('b')">B: Cards (estilo Filllo)</button>
  <button class="variant-tab" onclick="showVariant('c')">C: Híbrido (linha densa + affordance de card) ★ Selected</button>
</div>

<template id="icons">
  <svg data-icon="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
  <svg data-icon="users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7.5" r="3.5"/><path d="M17 8a3 3 0 0 1 0 6"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.36"/></svg>
  <svg data-icon="upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M6 9l6-6 6 6"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
  <svg data-icon="kanban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16"/><path d="M15 4v10"/></svg>
  <svg data-icon="message" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4-1L3 20l1.1-3.3A8.4 8.4 0 0 1 3 11.5 8.5 8.5 0 0 1 11.5 3 8.5 8.5 0 0 1 21 11.5z"/></svg>
  <svg data-icon="tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.4 12.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2a2 2 0 0 1 0-2.8L10.6 2.4A2 2 0 0 1 12 2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-.6 1.4z"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>
  <svg data-icon="trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
  <svg data-icon="wa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4-1L3 20l1.1-3.3A8.4 8.4 0 0 1 3 11.5 8.5 8.5 0 0 1 11.5 3 8.5 8.5 0 0 1 21 11.5z"/><path d="M9 10.5s.5 2.5 4.5 4.5c.5-.5 1-1.2 1-1.2"/></svg>
  <svg data-icon="phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.05 5A5 5 0 0 1 19 8.95M15.05 1A9 9 0 0 1 23 8.94m-1 7.98v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
  <svg data-icon="calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
</template>

<script>
  const NAV_ITEMS = [
    { icon: 'clock', label: 'Follow-ups' },
    { icon: 'users', label: 'Leads', active: true },
    { icon: 'upload', label: 'Importar' },
    { icon: 'kanban', label: 'Pipeline' },
    { icon: 'message', label: 'Templates' },
    { icon: 'tag', label: 'Sub-nichos' },
    { icon: 'trash', label: 'Lixeira' },
  ];

  const LEADS = [
    { name: 'Mariana Alves', niche: 'Nutricionista', stage: 'novo', stageLabel: 'Novo', phone: '(85) 9 8888-1122', followUp: '28/07/2026' },
    { name: 'Carlos Souza', niche: 'Terapeuta', stage: 'contatado', stageLabel: 'Contatado', phone: '(85) 9 7777-3344', followUp: '30/07/2026' },
    { name: 'Beatriz Lima', niche: 'Psicóloga', stage: 'negociacao', stageLabel: 'Negociação', phone: '(85) 9 6666-5566', followUp: '25/07/2026' },
    { name: 'Hion Ferreira', niche: 'Nutricionista', stage: 'fechado', stageLabel: 'Fechado', phone: '(85) 8888-8989', followUp: '17/09/2026' },
    { name: 'Renata Dias', niche: 'Fisioterapeuta', stage: 'novo', stageLabel: 'Novo', phone: '(85) 9 5555-1212', followUp: '29/07/2026' },
  ];

  function initials(name) { return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase(); }
  function iconSvg(name) {
    const tpl = document.getElementById('icons').content;
    const el = tpl.querySelector('[data-icon="' + name + '"]');
    return el ? el.outerHTML : '';
  }

  function sidebarHtml() {
    return `
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark">C</div>
          <div class="brand-text">CRM Leads</div>
        </div>
        <div class="nav-section-label">Principal</div>
        <nav class="nav-section">
          ${NAV_ITEMS.map(item => `
            <div class="nav-item ${item.active ? 'active' : ''}">
              ${iconSvg(item.icon)}
              <span>${item.label}</span>
            </div>
          `).join('')}
        </nav>
        <div class="sidebar-footer">
          <div class="avatar">A</div>
          <div class="avatar-name">Admin</div>
        </div>
      </aside>
    `;
  }

  function topbarHtml() {
    return `<div class="topbar"><h1>Leads</h1><button class="btn btn-primary">+ Novo lead</button></div>`;
  }

  function filtersHtml() {
    return `
      <div class="filters-bar">
        <div class="filter-pill">Sub-nicho: todos</div>
        <div class="filter-pill">Etapa: todas</div>
        <div class="filter-pill">${iconSvg('calendar')} Follow-up</div>
      </div>
    `;
  }

  function pingWa(btn) {
    btn.style.transform = 'scale(0.9)';
    setTimeout(() => btn.style.transform = '', 120);
  }

  // ---- Variant A: tabela restilizada ----
  function renderA() {
    document.getElementById('page-a').innerHTML = sidebarHtml() + `
      <main class="app-main">
        ${topbarHtml()}
        <div class="content">
          ${filtersHtml()}
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nome</th><th>Sub-nicho</th><th>Etapa</th><th>Follow-up</th><th>Telefone</th><th></th></tr></thead>
              <tbody>
                ${LEADS.map(l => `
                  <tr>
                    <td><div class="name-cell"><div class="avatar-sm">${initials(l.name)}</div><span style="font-weight:600">${l.name}</span></div></td>
                    <td style="color:var(--color-text-muted)">${l.niche}</td>
                    <td><span class="badge ${l.stage}">${l.stageLabel}</span></td>
                    <td style="color:var(--color-text-muted)">${l.followUp}</td>
                    <td style="color:var(--color-text-muted)">${l.phone}</td>
                    <td style="text-align:right"><button class="wa-btn" title="Abrir WhatsApp" onclick="pingWa(this)">${iconSvg('wa')}</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </main>
    `;
  }

  // ---- Variant B: cards estilo Filllo ----
  function renderB() {
    document.getElementById('page-b').innerHTML = sidebarHtml() + `
      <main class="app-main">
        ${topbarHtml()}
        <div class="content">
          ${filtersHtml()}
          <div class="cards-grid">
            ${LEADS.map(l => `
              <div class="lead-card">
                <div class="lead-card-top">
                  <div class="lead-card-id">
                    <div class="avatar-sm">${initials(l.name)}</div>
                    <div><div class="lead-card-name">${l.name}</div><div class="lead-card-niche">${l.niche}</div></div>
                  </div>
                  <span class="badge ${l.stage}">${l.stageLabel}</span>
                </div>
                <div class="lead-card-meta">${iconSvg('phone')} ${l.phone}</div>
                <div class="lead-card-meta">${iconSvg('calendar')} Follow-up: ${l.followUp}</div>
                <div class="lead-card-footer">
                  <span style="font-size:var(--text-xs);color:var(--color-text-faint)">Ver detalhes →</span>
                  <button class="wa-btn big" title="Abrir WhatsApp" onclick="event.stopPropagation(); pingWa(this)">${iconSvg('wa')} WhatsApp</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </main>
    `;
  }

  // ---- Variant C: híbrido ----
  function renderC() {
    document.getElementById('page-c').innerHTML = sidebarHtml() + `
      <main class="app-main">
        ${topbarHtml()}
        <div class="content">
          ${filtersHtml()}
          <div class="table-wrap">
            ${LEADS.map(l => `
              <div class="hybrid-row">
                <div class="name-cell" style="display:flex;align-items:center;gap:10px;">
                  <div class="avatar-sm">${initials(l.name)}</div>
                  <div><div style="font-weight:600">${l.name}</div><div style="font-size:var(--text-xs);color:var(--color-text-faint)">${l.niche}</div></div>
                </div>
                <div class="col"><span class="badge ${l.stage}">${l.stageLabel}</span></div>
                <div class="col">${iconSvg('calendar')} ${l.followUp}</div>
                <div class="col">${l.phone}</div>
                <button class="wa-btn" title="Abrir WhatsApp" onclick="pingWa(this)">${iconSvg('wa')}</button>
              </div>
            `).join('')}
          </div>
        </div>
      </main>
    `;
  }

  document.addEventListener('DOMContentLoaded', function () {
    renderA(); renderB(); renderC();
  });

  function showVariant(id) {
    document.querySelectorAll('.variant').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('variant-' + id).classList.add('active');
    event.target.classList.add('active');
  }

  function setViewport(px) {
    document.querySelectorAll('.app-shell').forEach(s => {
      s.style.maxWidth = px ? px + 'px' : 'none';
      s.style.margin = px ? '0 auto' : '0';
    });
  }
</script>

<div id="variant-a" class="variant active"><div id="page-a" class="app-shell"></div></div>
<div id="variant-b" class="variant"><div id="page-b" class="app-shell"></div></div>
<div id="variant-c" class="variant"><div id="page-c" class="app-shell"></div></div>

<div id="sketch-tools">
  <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'">
    <option value="default">Default</option>
  </select>
  <button onclick="setViewport(375)">Phone</button>
  <button onclick="setViewport(768)">Tablet</button>
  <button onclick="setViewport(0)">Desktop</button>
</div>
</body>
</html>
