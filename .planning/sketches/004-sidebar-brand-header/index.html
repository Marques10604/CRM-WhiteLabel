<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch 004 — Sidebar Brand Header</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--color-bg); color: var(--color-text); font-size: var(--text-base); padding-top: 48px; -webkit-font-smoothing: antialiased; }
  svg { display: block; width: 16px; height: 16px; flex-shrink: 0; }

  #variant-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; background: var(--color-surface); border-bottom: 1px solid var(--color-border); padding: 8px 16px; display: flex; gap: 8px; align-items: center; }
  #variant-nav .label { font-size: var(--text-xs); color: var(--color-text-muted); margin-right: 8px; }

  .compare-wrap { display: grid; grid-template-columns: repeat(3, minmax(220px, 260px)); gap: 24px; padding: 32px; justify-content: center; }
  .compare-col h3 { font-size: var(--text-sm); font-weight: 600; margin-bottom: 4px; color: var(--color-text); }
  .compare-col .desc { font-size: var(--text-xs); color: var(--color-text-muted); margin-bottom: 12px; line-height: 1.4; }

  .sidebar { width: var(--sidebar-width-expanded); background: var(--sidebar-bg); border: 1px solid var(--sidebar-border); border-radius: var(--radius-lg); display: flex; flex-direction: column; box-shadow: var(--shadow-sm); overflow: hidden; }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 20px 18px 22px; }
  .brand-mark { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .nav-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-faint); padding: 12px 14px 6px; }
  .nav-section { padding: 4px 14px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-md); color: var(--sidebar-text); cursor: pointer; font-size: var(--text-sm); font-weight: 500; transition: all 0.15s ease; margin-bottom: 3px; }
  .nav-item svg { color: var(--sidebar-text-muted); }
  .nav-item:hover { background: var(--sidebar-hover-bg); }
  .nav-item.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-text); font-weight: 600; }
  .nav-item.active svg { color: var(--sidebar-active-text); }
  .sidebar-footer { margin-top: auto; padding: 16px 18px; border-top: 1px solid var(--sidebar-border); display: flex; align-items: center; gap: 10px; }
  .avatar { width: 30px; height: 30px; border-radius: var(--radius-full); background: var(--color-primary-soft); color: var(--color-primary); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .avatar-name { font-size: var(--text-sm); font-weight: 600; }

  /* ---- Variant A: wordmark compacto (padrão Linear/Vercel) ---- */
  .brand-a { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--color-text); }

  /* ---- Variant B: wordmark confiante (maior, mais peso) ---- */
  .brand-b { font-size: 16px; font-weight: 700; letter-spacing: -0.005em; color: var(--color-text); }

  /* ---- Variant C: selo discreto, uppercase (padrão Notion/Attio) ---- */
  .brand-c { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-muted); }

  #sketch-tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font-family: system-ui; font-size: 12px; background: rgba(0,0,0,0.75); color: #fff; padding: 8px 12px; border-radius: 8px; opacity: 0.4; transition: opacity 0.2s; }
  #sketch-tools:hover { opacity: 1; }
</style>
</head>
<body>

<div id="variant-nav">
  <span class="label">Sketch 004 — Sidebar Brand Header · refinamento sobre o sketch 001 (vencedor C)</span>
</div>

<template id="icons">
  <svg data-icon="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
  <svg data-icon="users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7.5" r="3.5"/><path d="M17 8a3 3 0 0 1 0 6"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.36"/></svg>
  <svg data-icon="upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M6 9l6-6 6 6"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
  <svg data-icon="kanban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16"/><path d="M15 4v10"/></svg>
  <svg data-icon="message" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4-1L3 20l1.1-3.3A8.4 8.4 0 0 1 3 11.5 8.5 8.5 0 0 1 11.5 3 8.5 8.5 0 0 1 21 11.5z"/></svg>
  <svg data-icon="tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.4 12.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2a2 2 0 0 1 0-2.8L10.6 2.4A2 2 0 0 1 12 2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-.6 1.4z"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>
  <svg data-icon="trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
</template>

<div class="compare-wrap" id="compare-wrap"></div>

<div id="sketch-tools">refinamento: 3 tratamentos tipográficos</div>

<script>
  const NAV_ITEMS = [
    { icon: 'clock', label: 'Follow-ups' },
    { icon: 'users', label: 'Leads', active: true },
    { icon: 'upload', label: 'Importar' },
    { icon: 'kanban', label: 'Pipeline' },
    { icon: 'message', label: 'Templates' },
    { icon: 'tag', label: 'Sub-nichos' },
    { icon: 'trash', label: 'Lixeira' },
  ];

  function iconSvg(name) {
    const tpl = document.getElementById('icons').content;
    const el = tpl.querySelector('[data-icon="' + name + '"]');
    return el ? el.outerHTML : '';
  }

  function navHtml() {
    return NAV_ITEMS.map(item => `
      <div class="nav-item ${item.active ? 'active' : ''}">${iconSvg(item.icon)}<span>${item.label}</span></div>
    `).join('');
  }

  function sidebarHtml(brandClass, brandText) {
    return `
      <div class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark">I</div>
          <div class="${brandClass}">${brandText}</div>
        </div>
        <div class="nav-section-label">Principal</div>
        <nav class="nav-section">${navHtml()}</nav>
        <div class="sidebar-footer"><div class="avatar">A</div><div class="avatar-name">Admin</div></div>
      </div>
    `;
  }

  const VARIANTS = [
    { title: 'A: Wordmark compacto', desc: 'Padrão Linear/Vercel — 14px, semibold (600), tracking levemente negativo. Discreto, não compete com o conteúdo.', brandClass: 'brand-a', brandText: 'CRM Leads' },
    { title: 'B: Wordmark confiante', desc: 'Mais presença — 16px, bold (700). Fica mais "nome de produto", ocupa um pouco mais de espaço vertical.', brandClass: 'brand-b', brandText: 'CRM Leads' },
    { title: 'C: Selo discreto ★ Selected', desc: 'Padrão Notion/Attio — uppercase, 11px, tracking largo (0.08em), cor apagada. Trata a marca quase como uma etiqueta de categoria, não como título.', brandClass: 'brand-c', brandText: 'CRM LEADS' },
  ];

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('compare-wrap').innerHTML = VARIANTS.map(v => `
      <div class="compare-col">
        <h3>${v.title}</h3>
        <div class="desc">${v.desc}</div>
        ${sidebarHtml(v.brandClass, v.brandText)}
      </div>
    `).join('');
  });
</script>
</body>
</html>
