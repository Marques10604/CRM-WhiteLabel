<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch 001 — Sidebar Clean</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--color-bg);
    color: var(--color-text);
    font-size: var(--text-base);
    padding-top: 48px;
    -webkit-font-smoothing: antialiased;
  }
  svg { display: block; width: 16px; height: 16px; flex-shrink: 0; }

  /* ---------- Variant tab bar ---------- */
  #variant-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9998;
    background: var(--color-surface); border-bottom: 1px solid var(--color-border);
    padding: 8px 16px; display: flex; gap: 8px; align-items: center;
    font-family: var(--font-sans);
  }
  #variant-nav .label { font-size: var(--text-xs); color: var(--color-text-muted); margin-right: 8px; }
  .variant-tab {
    border: 1px solid var(--color-border); background: var(--color-surface);
    color: var(--color-text-muted); padding: 6px 12px; border-radius: var(--radius-md);
    font-size: var(--text-sm); cursor: pointer; transition: all 0.15s ease;
  }
  .variant-tab:hover { background: var(--color-surface-sunken); color: var(--color-text); }
  .variant-tab.active { background: var(--color-primary-soft); color: var(--color-primary); border-color: var(--color-primary); font-weight: 600; }

  .variant { display: none; }
  .variant.active { display: block; }

  /* ---------- Page shell ---------- */
  .app-shell { display: flex; min-height: calc(100vh - 48px); }
  .app-main { flex: 1; min-width: 0; }
  .topbar {
    height: 60px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; border-bottom: 1px solid var(--color-border); background: var(--color-surface);
  }
  .topbar h1 { font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.01em; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: none; cursor: pointer;
    font-family: var(--font-sans); font-size: var(--text-sm); font-weight: 600;
    border-radius: var(--radius-md); padding: 8px 14px; transition: all 0.15s ease;
  }
  .btn-primary { background: var(--color-primary); color: #fff; box-shadow: var(--shadow-sm); }
  .btn-primary:hover { background: var(--color-primary-hover); }

  .content { padding: 24px 28px; }
  .table-wrap {
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm);
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--color-text-faint); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--color-border);
    background: var(--color-surface-sunken);
  }
  tbody td { padding: 14px 16px; font-size: var(--text-base); border-bottom: 1px solid var(--color-border); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.15s ease; }
  tbody tr:hover { background: var(--color-surface-sunken); }
  .badge {
    display: inline-flex; align-items: center; padding: 3px 10px; border-radius: var(--radius-full);
    font-size: var(--text-xs); font-weight: 600; background: var(--color-whatsapp-soft); color: var(--color-whatsapp-hover);
  }
  .wa-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
    border-radius: var(--radius-md); background: var(--color-whatsapp-soft); color: var(--color-whatsapp-hover);
    border: none; cursor: pointer; transition: all 0.15s ease;
  }
  .wa-btn:hover { background: var(--color-whatsapp); color: #fff; transform: translateY(-1px); }

  /* ---------- Sidebar shared ---------- */
  .sidebar { flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--sidebar-border); display: flex; flex-direction: column; transition: width 0.15s ease; }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--color-primary);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;
  }
  .brand-text { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-muted); white-space: nowrap; }
  .brand-sub { font-size: 11px; color: var(--color-text-faint); white-space: nowrap; }

  .nav-section { padding: 4px 12px; }
  .nav-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-faint); padding: 12px 12px 6px; white-space: nowrap; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: var(--radius-md);
    color: var(--sidebar-text); cursor: pointer; font-size: var(--text-sm); font-weight: 500;
    transition: all 0.15s ease; margin-bottom: 2px; position: relative; white-space: nowrap;
  }
  .nav-item svg { flex-shrink: 0; width: 18px; height: 18px; color: var(--sidebar-text-muted); transition: color 0.15s ease; }
  .nav-item:hover { background: var(--sidebar-hover-bg); }
  .nav-item.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-text); font-weight: 600; }
  .nav-item.active svg { color: var(--sidebar-active-text); }
  .nav-item .nav-label { overflow: hidden; text-overflow: ellipsis; }

  .sidebar-footer { margin-top: auto; padding: 14px 16px; border-top: 1px solid var(--sidebar-border); display: flex; align-items: center; gap: 10px; }
  .avatar { width: 30px; height: 30px; border-radius: var(--radius-full); background: var(--color-primary-soft); color: var(--color-primary); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .avatar-name { font-size: var(--text-sm); font-weight: 600; white-space: nowrap; }

  /* tooltip for icon-only variant */
  .tooltip {
    position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
    background: #16181d; color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 5px;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.12s ease; z-index: 20;
  }
  .nav-item:hover .tooltip { opacity: 1; }

  /* ---- Variant A: icon-only ---- */
  #page-a .sidebar { width: var(--sidebar-width-compact); }
  #page-a .brand-sub, #page-a .nav-section-label, #page-a .nav-label, #page-a .avatar-name { display: none; }
  #page-a .sidebar-brand { justify-content: center; padding: 18px 0; }
  #page-a .nav-item { justify-content: center; padding: 10px; }
  #page-a .sidebar-footer { justify-content: center; }

  /* ---- Variant B: icon+label compact ---- */
  #page-b .sidebar { width: 192px; }
  #page-b .nav-section-label { display: none; }

  /* ---- Variant C: icon+label spaced (Filllo-style) ---- */
  #page-c .sidebar { width: var(--sidebar-width-expanded); }
  #page-c .sidebar-brand { padding: 20px 18px 22px; }
  #page-c .nav-section { padding: 4px 14px; }
  #page-c .nav-item { padding: 10px 14px; margin-bottom: 3px; }
  #page-c .sidebar-footer { padding: 16px 18px; }

  /* ---------- Sketch toolbar (per sketch-tooling.md) ---------- */
  #sketch-tools {
    position: fixed; bottom: 12px; right: 12px; z-index: 9999; font-family: system-ui; font-size: 12px;
    background: rgba(0,0,0,0.75); color: #fff; padding: 8px 12px; border-radius: 8px; opacity: 0.4;
    transition: opacity 0.2s; display: flex; gap: 10px; align-items: center;
  }
  #sketch-tools:hover { opacity: 1; }
  #sketch-tools select, #sketch-tools button {
    font-size: 11px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 3px 6px; cursor: pointer;
  }
</style>
</head>
<body>

<div id="variant-nav">
  <span class="label">Sketch 001 — Sidebar Clean</span>
  <button class="variant-tab active" onclick="showVariant('a')">A: Ícone só (rail)</button>
  <button class="variant-tab" onclick="showVariant('b')">B: Ícone + label (compacta)</button>
  <button class="variant-tab" onclick="showVariant('c')">C: Ícone + label (espaçada, estilo Filllo) ★ Selected</button>
</div>

<!-- Shared nav icons (feather/lucide-style, hand-drawn inline) -->
<template id="icons">
  <svg data-icon="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
  <svg data-icon="users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7.5" r="3.5"/><path d="M17 8a3 3 0 0 1 0 6"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.36"/></svg>
  <svg data-icon="upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M6 9l6-6 6 6"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
  <svg data-icon="kanban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16"/><path d="M15 4v10"/></svg>
  <svg data-icon="message" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4-1L3 20l1.1-3.3A8.4 8.4 0 0 1 3 11.5 8.5 8.5 0 0 1 11.5 3 8.5 8.5 0 0 1 21 11.5z"/></svg>
  <svg data-icon="tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.4 12.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2a2 2 0 0 1 0-2.8L10.6 2.4A2 2 0 0 1 12 2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-.6 1.4z"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>
  <svg data-icon="trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
  <svg data-icon="wa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4-1L3 20l1.1-3.3A8.4 8.4 0 0 1 3 11.5 8.5 8.5 0 0 1 11.5 3 8.5 8.5 0 0 1 21 11.5z"/><path d="M9 10.5s.5 2.5 4.5 4.5c.5-.5 1-1.2 1-1.2"/></svg>
</template>

<!-- ===================== VARIANT A ===================== -->
<div id="variant-a" class="variant active">
<div id="page-a" class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">I</div>
      <div class="brand-text">CRM Leads</div>
    </div>
    <nav class="nav-section" id="nav-a"></nav>
    <div class="sidebar-footer">
      <div class="avatar">A</div>
      <div class="avatar-name">Admin</div>
    </div>
  </aside>
  <main class="app-main">
    <div class="topbar"><h1>Leads</h1><button class="btn btn-primary">+ Novo lead</button></div>
    <div class="content" id="leads-a"></div>
  </main>
</div>
</div>

<!-- ===================== VARIANT B ===================== -->
<div id="variant-b" class="variant">
<div id="page-b" class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">I</div>
      <div class="brand-text">CRM Leads</div>
    </div>
    <nav class="nav-section" id="nav-b"></nav>
    <div class="sidebar-footer">
      <div class="avatar">A</div>
      <div class="avatar-name">Admin</div>
    </div>
  </aside>
  <main class="app-main">
    <div class="topbar"><h1>Leads</h1><button class="btn btn-primary">+ Novo lead</button></div>
    <div class="content" id="leads-b"></div>
  </main>
</div>
</div>

<!-- ===================== VARIANT C ===================== -->
<div id="variant-c" class="variant">
<div id="page-c" class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">I</div>
      <div class="brand-text">CRM Leads</div>
    </div>
    <div class="nav-section-label">Principal</div>
    <nav class="nav-section" id="nav-c"></nav>
    <div class="sidebar-footer">
      <div class="avatar">A</div>
      <div class="avatar-name">Admin</div>
    </div>
  </aside>
  <main class="app-main">
    <div class="topbar"><h1>Leads</h1><button class="btn btn-primary">+ Novo lead</button></div>
    <div class="content" id="leads-c"></div>
  </main>
</div>
</div>

<div id="sketch-tools">
  <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'">
    <option value="default">Default</option>
  </select>
  <button onclick="setViewport(375)">Phone</button>
  <button onclick="setViewport(768)">Tablet</button>
  <button onclick="setViewport(0)">Desktop</button>
</div>

<script>
  const NAV_ITEMS = [
    { icon: 'clock', label: 'Follow-ups' },
    { icon: 'users', label: 'Leads', active: true },
    { icon: 'upload', label: 'Importar' },
    { icon: 'kanban', label: 'Pipeline' },
    { icon: 'message', label: 'Templates' },
    { icon: 'tag', label: 'Sub-nichos' },
    { icon: 'trash', label: 'Lixeira' },
  ];

  const LEADS = [
    { name: 'Mariana Alves', niche: 'Nutricionista', stage: 'Novo', phone: '(85) 9 8888-1122' },
    { name: 'Carlos Souza', niche: 'Terapeuta', stage: 'Contatado', phone: '(85) 9 7777-3344' },
    { name: 'Beatriz Lima', niche: 'Psicóloga', stage: 'Negociação', phone: '(85) 9 6666-5566' },
    { name: 'Hion Ferreira', niche: 'Nutricionista', stage: 'Fechado', phone: '(85) 8888-8989' },
  ];

  function iconSvg(name) {
    const tpl = document.getElementById('icons').content;
    const el = tpl.querySelector('[data-icon="' + name + '"]');
    return el ? el.outerHTML : '';
  }

  function renderNav(containerId) {
    const el = document.getElementById(containerId);
    el.innerHTML = NAV_ITEMS.map(item => `
      <div class="nav-item ${item.active ? 'active' : ''}">
        ${iconSvg(item.icon)}
        <span class="nav-label">${item.label}</span>
        <span class="tooltip">${item.label}</span>
      </div>
    `).join('');
    el.querySelectorAll('.nav-item').forEach(n => n.addEventListener('click', () => {
      el.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
      n.classList.add('active');
    }));
  }

  function renderLeads(containerId) {
    const el = document.getElementById(containerId);
    el.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nome</th><th>Sub-nicho</th><th>Etapa</th><th>Telefone</th><th></th></tr></thead>
          <tbody>
            ${LEADS.map(l => `
              <tr>
                <td style="font-weight:600">${l.name}</td>
                <td style="color:var(--color-text-muted)">${l.niche}</td>
                <td><span class="badge">${l.stage}</span></td>
                <td style="color:var(--color-text-muted)">${l.phone}</td>
                <td style="text-align:right">
                  <button class="wa-btn" title="Abrir WhatsApp" onclick="pingWa(this)">${iconSvg('wa')}</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  function pingWa(btn) {
    btn.style.transform = 'scale(0.9)';
    setTimeout(() => btn.style.transform = '', 120);
  }

  ['a', 'b', 'c'].forEach(v => { renderNav('nav-' + v); renderLeads('leads-' + v); });

  function showVariant(id) {
    document.querySelectorAll('.variant').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('variant-' + id).classList.add('active');
    event.target.classList.add('active');
  }

  function setViewport(px) {
    document.querySelectorAll('.app-shell').forEach(s => {
      s.style.maxWidth = px ? px + 'px' : 'none';
      s.style.margin = px ? '0 auto' : '0';
      s.style.border = px ? '1px solid var(--color-border)' : 'none';
    });
  }
</script>
</body>
</html>
